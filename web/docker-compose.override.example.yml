# 개발 환경 오버라이드 템플릿
# 사용법: cp docker-compose.override.example.yml docker-compose.override.yml
#
# 이 파일은 로컬 개발 환경에서 자체서명 인증서를 사용하는 OAuth 서버에
# 접근할 때 필요한 설정을 제공합니다.

services:
  storygraph:
    environment:
      # 자체서명 인증서 허용 (개발 환경 전용)
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    extra_hosts:
      # 로컬 OAuth 서버 접근 (host-gateway는 Docker 호스트 IP로 해석됨)
      - "catcident.lan:host-gateway"
