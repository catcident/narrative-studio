x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  storygraph:
    container_name: storygraph
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - internal
      - caddy
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1: Alpine에서 localhost→IPv6 해석 방지
      # /api/config: 인증 미들웨어 우회 (공개 API)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging: *default-logging

  storygraph-tools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    working_dir: /app
    command: ["npm", "run", "check"]
    environment:
      - NEXT_TELEMETRY_DISABLED=1
    networks:
      - internal
    logging: *default-logging

  mongodb:
    image: mongo:7
    entrypoint:
      - /bin/sh
      - -lc
      - >
        set -eu;
        key_file="/data/db/mongodb-keyfile";
        key_source="$${MONGO_REPLICA_SET_KEY:-}";
        if [ -z "$${key_source}" ]; then key_source="$${MONGO_INITDB_ROOT_PASSWORD:-storygraph-local-replica-key}"; fi;
        key_value="$$(printf '%s' "$${key_source}" | sha256sum | awk '{print $$1}')";
        printf '%s\n' "$${key_value}" > "$${key_file}";
        chmod 400 "$${key_file}";
        chown mongodb:mongodb "$${key_file}";
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$${key_file}"
    # MONGO_INITDB_ROOT_USERNAME/PASSWORD는 .env.local에서 주입
    # (Compose ${VAR} 치환은 .env만 읽으므로 env_file 사용)
    env_file:
      - .env.local
    environment:
      MONGO_INITDB_DATABASE: character_relationship_chart
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@127.0.0.1:27017/admin?authSource=admin"
          --quiet --eval "db.adminCommand('ping')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  mongodb-init:
    image: mongo:7
    env_file:
      - .env.local
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - >
        mongosh "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/admin?authSource=admin"
        --quiet --eval
        "try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}).ok }"
    logging: *default-logging

volumes:
  mongodb_data:

networks:
  internal:
    driver: bridge
  caddy:
    external: true
