x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  storygraph:
    container_name: storygraph
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - internal
      - caddy
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1: Alpine에서 localhost→IPv6 해석 방지
      # /api/config: 인증 미들웨어 우회 (공개 API)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging: *default-logging

  mongodb:
    image: mongo:7
    # MONGO_INITDB_ROOT_USERNAME/PASSWORD는 .env.local에서 주입
    # (Compose ${VAR} 치환은 .env만 읽으므로 env_file 사용)
    env_file:
      - .env.local
    environment:
      MONGO_INITDB_DATABASE: character_relationship_chart
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

volumes:
  mongodb_data:

networks:
  internal:
    driver: bridge
  caddy:
    external: true
